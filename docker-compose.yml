# ===========================================================================
# Produção — Dokploy (wmsapaevideira.mlsoftwares.com.br)
# Serviços: app (php-fpm), nginx, mysql, redis, queue worker, reverb.
# O Traefik do Dokploy faz o proxy/HTTPS: exponha o serviço `nginx` no
# domínio e ele roteia para a porta 80 deste container.
# Segredos (senhas, APP_KEY) são lidos do ambiente do Dokploy — não
# estão hardcoded aqui. Use .env.prod como template na aba Environment.
# ===========================================================================

# Variáveis repassadas do ambiente do Dokploy para os containers PHP
# (app/queue/reverb). SEM isso, o Laravel não enxerga DB_HOST etc. e o
# entrypoint trava esperando um banco que nunca conecta.
x-app-environment: &app-environment
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL}
  APP_LOCALE: ${APP_LOCALE:-pt_BR}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-pt_BR}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-error}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-wms_agropecuaria}
  DB_USERNAME: ${DB_USERNAME:-wms_agropecuaria}
  DB_PASSWORD: ${DB_PASSWORD}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  REDIS_CLIENT: ${REDIS_CLIENT:-predis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_PORT: ${REDIS_PORT:-6379}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WMS}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: ${REVERB_HOST}
  REVERB_PORT: ${REVERB_PORT:-443}
  REVERB_SCHEME: ${REVERB_SCHEME:-https}
  FRONTEND_URL: ${FRONTEND_URL}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: wms_agropecuaria_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *app-environment
    networks:
      - wms_agropecuaria
      - dokploy-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: wms_agropecuaria_nginx
    restart: unless-stopped
    # Não expõe porta no host: o Traefik (Dokploy) encaminha o domínio
    # para esta porta 80.
    # Usa o estágio "nginx" do Dockerfile, que já traz o public/build
    # compilado pelo estágio node. Assim o nginx serve o CSS/JS sem
    # depender do bind do host (que não tem os assets).
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wms_agropecuaria
      - dokploy-network
    depends_on:
      - app

  # Worker de fila (lê do Redis). Necessário porque QUEUE_CONNECTION=redis.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: wms_agropecuaria_queue
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *app-environment
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    networks:
      - wms_agropecuaria
      - dokploy-network
    depends_on:
      - redis
      - app

  # Websockets (Reverb) atrás do nginx. Necessário para o laravel-echo.
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: wms_agropecuaria_reverb
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *app-environment
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    networks:
      - wms_agropecuaria
      - dokploy-network
    depends_on:
      - redis
      - app

  mysql:
    image: mysql:8.4
    container_name: wms_agropecuaria_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wms_agropecuaria}
      MYSQL_USER: ${DB_USERNAME:-wms_agropecuaria}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-JMeksla319012lksdmaa!!mds3#21}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wms_agropecuaria
      - dokploy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-JMeksla319012lksdmaa!!mds3#21}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wms_agropecuaria_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - wms_agropecuaria
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  wms_agropecuaria:
    driver: bridge
  # Rede compartilhada do Dokploy: permite que containers de OUTROS
  # stacks (ex.: phpmyadmin de outro projeto) alcancem este MySQL
  # usando o container_name como host (wms_mysql).
  dokploy-network:
    external: true

volumes:
  mysql_data:
  redis_data:
