# ===========================================================================
# Desenvolvimento local (Docker) - Usando variáveis do .env
# ===========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - wms
    profiles:
      - app
    depends_on:
      - mysql
      - redis
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: wms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wms
    profiles:
      - app
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=1 --timeout=0
    volumes:
      - .:/var/www
    networks:
      - wms
    profiles:
      - app
    depends_on:
      - redis
      - app
    env_file:
      - .env

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www
    ports:
      - "8080:8080"
    networks:
      - wms
    profiles:
      - app
    depends_on:
      - redis
      - mysql
    env_file:
      - .env

  mysql:
    image: mysql:8.4
    container_name: wms_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wms}
      # MYSQL_USER: root
      # MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_secret}   # ou defina no .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wms
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wms
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  wms:
    driver: bridge

volumes:
  mysql_data:
  redis_data: